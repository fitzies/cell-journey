<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Cell Journey onboarding · minimal directions</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..650,70..100&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&family=Newsreader:opsz,wght@6..72,300..650&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#efede8;color:#111;font-family:Inter,system-ui,sans-serif}.page{padding:34px clamp(16px,4vw,56px) 72px}.intro{max-width:1180px;margin:0 auto 34px}.kicker{font:800 12px/1 IBM Plex Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:#5e5b55}.intro h1{margin:12px 0;font:430 clamp(42px,7vw,82px)/.92 Fraunces,serif;letter-spacing:-.055em}.intro p{max-width:860px;color:#66615b;font-size:17px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:44px;max-width:1560px;margin:auto;align-items:start}@media(max-width:520px){.grid{grid-template-columns:1fr}.page{padding-inline:12px}.phone{transform:scale(.92);transform-origin:top center;margin-bottom:-60px!important}}.concept{display:grid;gap:14px}.label{display:flex;justify-content:space-between;align-items:end;color:#555}.label b{font:800 12px/1 IBM Plex Mono,monospace;letter-spacing:.13em;text-transform:uppercase}.label span{font-size:13px;color:#777}.phone{width:410px;height:820px;margin:0 auto;border-radius:46px;padding:12px;background:#0b0b0b;box-shadow:0 20px 55px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.1)}.screen{--bg:#fbfaf6;--fg:#141414;--muted:#6c6963;--card:#fff;--line:#dedbd3;--accent:#111;--soft:#f1eee7;--on:#fff;position:relative;overflow:hidden;height:100%;border-radius:36px;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}.paper{--bg:#f7f2e8;--fg:#211c16;--muted:#766f66;--card:#fffaf0;--line:#ded4c4;--accent:#3b332a;--soft:#eee3d2;--on:#fff7ea}.slate{--bg:#f5f7f8;--fg:#111820;--muted:#67707a;--card:#fff;--line:#d9dee3;--accent:#253140;--soft:#e9edf1;--on:#fff}.warm{--bg:#f8f4ef;--fg:#201915;--muted:#756b62;--card:#fffdf9;--line:#ded6cd;--accent:#5d4030;--soft:#eee5dd;--on:#fff8f1}.mono{--bg:#fff;--fg:#000;--muted:#555;--card:#fff;--line:#111;--accent:#000;--soft:#f4f4f4;--on:#fff}.night{--bg:#151515;--fg:#f4f1ea;--muted:#aaa49b;--card:#1e1e1e;--line:#333;--accent:#f4f1ea;--soft:#242424;--on:#111}.top{position:relative;z-index:2;display:flex;gap:12px;align-items:center;padding:18px 22px 0}.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);color:var(--fg);background:transparent;font-size:23px}.rail{height:2px;flex:1;border-radius:999px;background:var(--line);overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:999px;transition:width .42s cubic-bezier(.2,.8,.2,1)}.spacer{width:40px}.body{position:relative;z-index:2;flex:1;padding:36px 28px 18px;overflow:hidden}.footer{position:relative;z-index:3;padding:16px 22px 24px}.eyebrow{font:800 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.q{margin:18px 0 10px;font:430 38px/1.02 Fraunces,serif;letter-spacing:-.045em}.paper .q{font-family:Newsreader,serif}.mono .q{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.055em}.night .q{font-family:Newsreader,serif}.hint{color:var(--muted);font-size:15px;line-height:1.55;max-width:315px}.field,.pill{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:16px 17px;font-size:16px}.mono .field,.mono .pill,.mono .chip,.mono .note,.mono .back{border-width:1.5px;border-radius:4px}.field.big{font:400 25px Fraunces,serif;border-color:var(--fg);box-shadow:none}.mono .field.big{font-family:Inter,sans-serif;font-weight:750}.stack{display:grid;gap:10px;margin-top:30px}.pill{display:flex;align-items:center;gap:12px;transition:.18s}.pill.on{background:var(--fg);border-color:var(--fg);color:var(--on)}.night .pill.on{background:var(--fg);color:var(--on)}.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:10px;flex:none}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.chip{padding:12px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700}.chip.on{background:var(--fg);color:var(--on);border-color:var(--fg)}.cta{width:100%;border:0;border-radius:16px;background:var(--fg);color:var(--on);height:58px;font-weight:850;font-size:16px;box-shadow:none}.mono .cta{border-radius:4px}.secondary{text-align:center;margin-top:14px;color:var(--muted);font-weight:650;font-size:14px}.note{margin-top:26px;padding:15px;border-radius:18px;background:var(--soft);border:1px solid var(--line);display:flex;gap:12px;text-align:left}.avatar{width:42px;height:42px;border-radius:12px;background:var(--fg);color:var(--on);display:grid;place-items:center;font-weight:900;flex:none}.mono .avatar{border-radius:4px}.success{width:100px;height:100px;border-radius:50%;margin:0 auto 28px;background:var(--fg);color:var(--on);display:grid;place-items:center;font-size:42px}.divider{height:1px;background:var(--line);margin:28px 0}.fade,.fade>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}.fade>*:nth-child(2){animation-delay:.04s}.fade>*:nth-child(3){animation-delay:.08s}.fade>*:nth-child(4){animation-delay:.12s}.fade>*:nth-child(5){animation-delay:.16s}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="page"><section class="intro"><div class="kicker">Cell Journey · minimal explorations</div><h1>Five quieter onboarding directions.</h1><p>Same AGENTS.md flow, less glow, fewer colors, more whitespace. Each iPhone is full-width within its card and clickable independently so the screens don’t feel squeezed.</p></section><section class="grid" id="grid"></section></main><script>
const variants=[
{id:'mono',name:'01 B&W System',desc:'pure black and white, product-first'},
{id:'paper',name:'02 Warm Paper',desc:'soft editorial neutrals'},
{id:'slate',name:'03 Slate Native',desc:'cool greys, app-store clean'},
{id:'warm',name:'04 Quiet Chapel',desc:'warm taupe, minimal church tone'},
{id:'night',name:'05 Night Mono',desc:'dark monochrome, no glow'}];
const steps=[
{t:'auth',ey:'SIGNED IN',q:'Let’s set up your cell profile.',h:'You’re signed in. These details help your leader recognize you and keep attendance accurate.',cta:'Begin profile'},
{t:'full',ey:'YOUR NAME',q:'What’s your full name?',h:'Use the name your leader would know you by.',cta:'Continue'},
{t:'pref',ey:'OPTIONAL',q:'Do you have a preferred name?',h:'Leave it blank if your full name is what you usually go by.',cta:'Continue'},
{t:'services',ey:'SERVICES',q:'Which service do you attend?',h:'Pick one or more. This stays editable in your profile.',cta:'Continue · 2 picked'},
{t:'region',ey:'REGION',q:'Where are you based in Singapore?',h:'Required for your profile. Choose the closest region.',cta:'Continue'},
{t:'codeIntro',ey:'JOIN YOUR CELL',q:'Now enter your group code.',h:'Groups are private. Your leader approves the request before you can view the group schedule.',cta:'I have my code'},
{t:'code',ey:'GROUP CODE',q:'Enter the code from your leader.',h:'Codes are usually shared in person or through your church chat.',cta:'Find group'},
{t:'review',ey:'CONFIRM GROUP',q:'Is this your cell group?',h:'If this looks wrong, go back and check the code before sending the request.',cta:'Request to join'},
{t:'sent',ey:'REQUEST SENT',q:'Waiting for leader approval.',h:'You requested to join Thursday East Cell. Your profile is saved while you wait.',cta:'Done'},
{t:'rejected',ey:'IF REJECTED',q:'No worries — try another code.',h:'If a leader rejects or removes you later, your profile answers stay saved and you return here.',cta:'Enter another code'}];
function common(s){return `<div class="eyebrow">${s.ey}</div><div class="q">${s.q}</div><p class="hint">${s.h}</p>`}
function body(s){
 if(s.t==='auth')return `<div class="fade">${common(s)}<div class="note"><div class="avatar">JT</div><div><b>Jordan Tan</b><br><span class="hint">Signed in with Google</span></div></div><div class="divider"></div><div class="hint">Next: name, preferred name, services, region, and group code.</div></div>`;
 if(s.t==='full')return `<div class="fade">${common(s)}<div class="stack"><input class="field big" value="Jordan Tan"/><div class="hint">Shown to your cell leader after approval.</div></div></div>`;
 if(s.t==='pref')return `<div class="fade">${common(s)}<div class="stack"><input class="field big" value="Jords"/><div class="pill"><span class="dot"></span>Skip preferred name</div></div></div>`;
 if(s.t==='services')return `<div class="fade">${common(s)}<div class="stack"><div class="pill on"><span class="dot">✓</span>Saturday 5 PM</div><div class="pill on"><span class="dot">✓</span>Sunday 10 AM</div><div class="pill"><span class="dot"></span>Sunday 12 PM</div><div class="pill"><span class="dot"></span>Online service</div></div></div>`;
 if(s.t==='region')return `<div class="fade">${common(s)}<div class="chips"><span class="chip">North</span><span class="chip">South</span><span class="chip on">East</span><span class="chip">West</span><span class="chip">Central</span><span class="chip">Northeast</span></div></div>`;
 if(s.t==='codeIntro')return `<div class="fade">${common(s)}<div class="note"><div class="avatar">#</div><div><b>Private groups</b><br><span class="hint">You’ll see a pending state until your leader approves.</span></div></div><div class="note"><div class="avatar">?</div><div><b>Need a code?</b><br><span class="hint">Ask your cell leader for the latest group code.</span></div></div></div>`;
 if(s.t==='code')return `<div class="fade">${common(s)}<div class="stack"><input class="field big" value="EAST-247" style="text-transform:uppercase;letter-spacing:.12em;font-family:IBM Plex Mono,monospace;font-size:24px"/><div class="pill"><span class="dot">?</span>Code not working?</div></div></div>`;
 if(s.t==='review')return `<div class="fade">${common(s)}<div class="note"><div class="avatar">TE</div><div><b>Thursday East Cell</b><br><span class="hint">Leader: Amelia Lim · 18 members · Tampines / Bedok</span></div></div><div class="stack"><div class="pill on"><span class="dot">✓</span>This is my group</div><div class="pill"><span class="dot">←</span>Try a different code</div></div></div>`;
 if(s.t==='sent')return `<div class="fade" style="text-align:center;padding-top:46px"><div class="success">✓</div>${common(s)}<div class="note"><div class="avatar">A</div><div><b>Amelia has been notified</b><br><span class="hint">You’ll get a push notification when she approves or rejects the request.</span></div></div></div>`;
 return `<div class="fade">${common(s)}<div class="note"><div class="avatar">!</div><div><b>Request not approved</b><br><span class="hint">Your profile answers stay saved. Historical records remain intact.</span></div></div><div class="stack"><input class="field big" value="" placeholder="NEW-CODE" style="text-transform:uppercase;letter-spacing:.12em;font-family:IBM Plex Mono,monospace;font-size:24px"/></div></div>`}
function render(){grid.innerHTML=variants.map((v,i)=>`<article class="concept"><div class="label"><b>${v.name}</b><span>${v.desc}</span></div><div class="phone"><div class="screen ${v.id}" data-variant="${i}" data-step="0"><div class="top"><button class="back">‹</button><div class="rail"><div class="fill" style="width:${100/steps.length}%"></div></div><div class="spacer"></div></div><div class="body">${body(steps[0])}</div><div class="footer"><button class="cta">${steps[0].cta}</button><div class="secondary">Already onboarded? Go to app</div></div></div></div></article>`).join('');document.querySelectorAll('.screen').forEach(sc=>{sc.querySelector('.cta').onclick=()=>adv(sc,1);sc.querySelector('.back').onclick=()=>adv(sc,-1)})}
function adv(sc,d){let n=+sc.dataset.step+d;if(n<0)n=0;if(n>=steps.length)n=0;sc.dataset.step=n;const s=steps[n];sc.querySelector('.fill').style.width=((n+1)/steps.length*100)+'%';sc.querySelector('.body').innerHTML=body(s);sc.querySelector('.cta').textContent=s.cta;sc.querySelector('.secondary').textContent=n===0?'Already onboarded? Go to app':n===steps.length-1?'Profile answers are preserved':'Back and edit anytime'}render();
</script></body></html>
